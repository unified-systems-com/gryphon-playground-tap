manifest_version = "0"
plugin_version = "0.6.3" # x-release-please-version
slug = "gryphon_playground"
name = "Gryphon Playground"
description = "The Gridkin scenario corpus + harness for testing the Gryphon query language, built on the grid_fixtures node vocabulary."

# Vocabulary dependency (req-plugin-arch-dependencies). gryphon_playground owns no
# node/edge types of its own: its Gridkin corpus references the grid_fixtures__*
# entity/edge types by string, so grid_fixtures MUST be installed + migrated before
# this plugin is loaded. This is a DATA/vocabulary edge (there is no import-time
# `tap_plugin.grid_fixtures` in this package — the AST scanner observes none), declared
# here so the pre-boot consistency gate enforces install-order (grid_fixtures first).
depends_on = [
    { slug = "grid_fixtures", note = "Gridkin corpus references grid_fixtures__* node/edge types by string; grid_fixtures must be installed + migrated first." },
]

# Boot records shipped in this package (req-boot-bootstrap-records-in-package /
# req-boot-bootstrap-discovery). Each rides the wheel at tap_plugin/gryphon_playground/boot/
# and is selected by pointer `<source-ref>#<name>`. `sha256` is the referrer-held integrity
# digest of the canonicalized record (req-boot-bootstrap-record-version) — MACHINE-MANAGED:
# regenerate with `scripts/boot-record-hash --refresh`, never hand-edit. There is deliberately
# NO per-record version (a record's version is this plugin's, single-sourced). The
# tap/tests/test_boot_records.py guard fails closed on digest drift or a manifest<->files
# mismatch. gryphon ships no `default` record: a bare pointer fails closed naming these
# (req-boot-bootstrap-default-record-2).
requires_tap = ">=0.3.0"  # the floor the push/PR lane proves (tap#365; George 2026-09-10; raised from 0.1.5 on 2026-10-13, tap#1013)

[[boot.records]]
name = "ci"
description = "RESERVED NAME (req-boot-bootstrap-ci-record): the stack this plugin's own tests run in — depends_on closure + self, offline, credential-free. The consumer flips self to editable."
sha256 = "4035b8418918e538a89a3eb856a625402b7a44166f12dc3fb1c9eea2b3babdc1"

[[boot.records]]
name = "playground"
description = "Muck around: grid_fixtures vocab + Gridkin corpus, no workers, empty grid."
sha256 = "a7f633f33b96b0cbc40709695856d6421a46ee9d192b15fbee499743c2c4d40e"

[[boot.records]]
