# Nightly self-test (Stage 4 of unified-systems-com/tap#363, req-tap-plugin-extdev-repo-ci-12).
#
# A THIN CALLER, the same shape the other 23 plugin repos carry. Running this plugin against core
# `main` and turning a red night into one issue that the next green closes both live in core's
# reusable `plugin-nightly.yml`, so they are fixed once for every plugin instead of once per repo.
#
# This repo used to be the exception, and its own comment said so. It is not any more: the fuzz
# campaign that could not be expressed here moved to `fuzz-campaign.yml`, its own pipeline, keeping
# the dispatch inputs, the after-tests command and the ledger and campaign jobs that this thin
# caller has no place for. Two pipelines, nothing deleted (George, 2026-09-27).
#
# Only what cannot move lives here: the `schedule` trigger — a reusable workflow's own triggers are
# not consulted when it is called — the cron MINUTE, staggered per repo so the org's nightlies do
# not burst, the slug, the pin, the grant, and the timeout.
#
# The 90-minute ceiling stays even though the campaign has left. It is a ceiling, not a
# reservation: a suite that finishes in twenty minutes costs twenty minutes, and this plugin's
# in-package suite is the largest in the fleet. Losing a whole night to a timeout would cost more
# than the ceiling ever does.
#
# No `latest_ref`: there is deliberately no "latest core release" row. The floor is proven on every
# push, a release is too late to be early warning, and a hardcoded release ref goes stale and reds
# the whole run on a question nobody is asking. The input is optional for that reason.
name: nightly
on:
  schedule:
    - cron: "21 10 * * *"   # minute staggered per repo so the org's nightlies do not burst
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nightly:
    uses: unified-systems-com/tap/.github/workflows/plugin-nightly.yml@57505751b27900e5d58fc0c2b40df32f18a2b980
    # REQUIRED on this job. GitHub checks every job of a called workflow — and of the workflows IT
    # calls — against this grant BEFORE starting anything, so a scope missing here fails the whole
    # run at startup with zero jobs and no log. `security-events: write` is plugin-ci's SARIF
    # upload; `issues: write` is the owner-issue job and is the only write in the tree.
    #
    # `contents: write` is deliberately absent, where the old hand-rolled lane granted it. At this
    # pin plugin-ci holds no `contents: write` job at all, and nothing in plugin-nightly writes to
    # the repository.
    permissions:
      contents: read
      security-events: write
      issues: write
    with:
      plugin_slug: gryphon_playground
      boot_and_test_timeout_minutes: 90
      assignee: notgeorge   # no CODEOWNERS in this repo — the org's maintainer login
    secrets:
      harness_pat: ${{ secrets.TAP_CORE_RO_PAT }}
